<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before first paint, so there is no flash of the wrong theme. Dark is the default. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('pdc-theme-v3');
          if (t !== 'light' && t !== 'dark') t = 'dark';
        } catch (e) { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('has-js');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f7f5ef' : '#0b0b0c');
      })();
    </script>
    <!-- SEO: home page defaults. `npm run build` rewrites these for every page from src/data/seo.js
         (scripts/prerender-seo.mjs), and components/RouteSeo.jsx keeps them current while browsing. -->
